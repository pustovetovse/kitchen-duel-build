  <use href="#b" fill="none" stroke="#3B2416" stroke-width="8"/>
  <path d="M108 14L108 152" stroke="#3B2416" stroke-width="6"/>
  <rect x="80" y="44" width="16" height="66" rx="8" fill="#E6E9EE" stroke="#3B2416" stroke-width="5"/>

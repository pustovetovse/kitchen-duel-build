<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 168">
  <!-- Холодильник распахнут: набег соперника. Собирает tools/art/fridge-open.py -->
  <defs>
    <rect id="b" x="12" y="10" width="296" height="146" rx="34"/>
    <clipPath id="c"><use href="#b"/></clipPath>
  </defs>
  <ellipse cx="160" cy="160" rx="150" ry="8" fill="#3B2416" opacity=".18"/>
  <use href="#b" fill="#E5484D"/>
  <g clip-path="url(#c)">
    <rect x="12" y="120" width="296" height="40" fill="#B83236"/>
    <path d="M40 24L100 24" stroke="#F48A8C" stroke-width="12" stroke-linecap="round"/>
    <!-- нутро: светлая камера, полки, еда -->

    <path d="M130 62V38L136 30H150L156 38V62Z" fill="#fff" stroke="#3B2416" stroke-width="4" stroke-linejoin="round"/>
    <rect x="132" y="44" width="22" height="10" fill="#5AA9E6"/>
    <path d="M168 62L206 42L216 62Z" fill="#FFE14D" stroke="#3B2416" stroke-width="4" stroke-linejoin="round"/>
    <circle cx="196" cy="55" r="3" fill="#E0B400"/><circle cx="206" cy="57" r="2.5" fill="#E0B400"/>
    <!-- средняя: сосиски, помидор -->
    <g stroke="#3B2416" stroke-width="4"><rect x="226" y="80" width="40" height="14" rx="7" fill="#C8553D"/><rect x="232" y="88" width="40" height="14" rx="7" fill="#D9744F"/></g>
    <circle cx="140" cy="88" r="12" fill="#E5484D" stroke="#3B2416" stroke-width="4"/><path d="M136 77l4 4 4-4" stroke="#5DB33A" stroke-width="3" fill="none"/>
    <!-- нижняя: арбуз-половинка и горошек -->
    <path d="M150 146A26 26 0 0 1 202 146Z" fill="#E5484D" stroke="#3B2416" stroke-width="4"/>
    <path d="M150 146A26 26 0 0 1 202 146" fill="none" stroke="#3E9B45" stroke-width="5"/>
    <g fill="#7CC74A" stroke="#3B2416" stroke-width="3"><circle cx="232" cy="140" r="6"/><circle cx="246" cy="142" r="6"/><circle cx="260" cy="140" r="6"/></g>

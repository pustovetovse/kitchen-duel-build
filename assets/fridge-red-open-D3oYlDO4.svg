  <path d="M300 14L318 2V164L300 152Z" fill="#E5484D" stroke="#3B2416" stroke-width="6" stroke-linejoin="round"/>
  <path d="M304 44L314 38M304 80L314 76M304 116L314 114" stroke="#FFF6E6" stroke-width="5" stroke-linecap="round"/>
  <path d="M36 156L36 166M284 156L284 166" stroke="#3B2416" stroke-width="10" stroke-linecap="round"/>
